version: '3.8'

services:
  cve-platform:
    build: .
    container_name: cve_etl_eda_app
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:////app/db/cve_database.db
      - NVD_API_KEY=${NVD_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./db:/app/db
    restart: unless-stopped

  # Optional MySQL database service (if MySQL is preferred over SQLite)
  # To use MySQL:
  # 1. Uncomment mysql service below
  # 2. Update cve-platform DATABASE_URL to: mysql+pymysql://cve_user:cve_pass@mysql:3306/cve_db

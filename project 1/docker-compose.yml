  # mysql:
  #   image: mysql:8.0
  #   container_name: cve_mysql_db
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: cve_db
  #     MYSQL_USER: cve_user
  #     MYSQL_PASSWORD: cve_pass
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql

